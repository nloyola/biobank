# -*- mode: conf -*-

upstream tomcat {
    server localhost:8080;
}

# Thick-client download page (plain HTTP). The styled page lives in
# downloads-page/; the ZIPs it links to are mounted (read-only) under
# downloads/ from the host folder selected by DOWNLOADS_DIR.
server {
    listen 80;
    server_name localhost;
    access_log /dev/stdout;
    error_log /dev/stderr;

    # The styled landing page.
    location = / {
        root /usr/share/nginx/downloads-page;
        try_files /index.html =404;
    }

    # Machine-readable listing the page fetches to render the download links.
    # autoindex only fires for a directory request (URI ending in '/'), so
    # rewrite the flat /files.json path to an internal trailing-slash location.
    location = /files.json {
        rewrite ^ /__downloads_index/ last;
    }

    location = /__downloads_index/ {
        internal;
        alias /usr/share/nginx/downloads/;
        autoindex on;
        autoindex_format json;
    }

    # The ZIPs themselves, served as direct downloads (no listing here).
    location /files/ {
        alias /usr/share/nginx/downloads/;
        autoindex off;
    }
}


server {
    listen 8000;
    server_name localhost;
    access_log /dev/stdout;
    error_log /dev/stderr;
    return 301 https://$host$request_uri;
}


server {
    listen 443 ssl;
    server_name localhost;
    access_log /dev/stdout;
    error_log /dev/stderr;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA;
    ssl_prefer_server_ciphers on;
    ssl_certificate     /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    location /biobank/ {
        proxy_pass http://tomcat;
    }

    # Return a temporary redirect to '/biobank/' when user requests '/'
    location = / {
        return 302 /biobank/;
    }
}
