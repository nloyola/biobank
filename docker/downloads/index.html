<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BioBank Thick Client - Downloads</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --fg: #1c2733;
      --muted: #5b6b7b;
      --border: #dfe4ea;
      --accent: #1f6feb;
      --accent-fg: #ffffff;
      --tag-bg: #eaf1fb;
      --tag-fg: #1f5fbf;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card-bg: #161b22;
        --fg: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --accent: #388bfd;
        --accent-fg: #ffffff;
        --tag-bg: #172033;
        --tag-fg: #6cb0ff;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }
    header { margin-bottom: 32px; }
    h1 {
      font-size: 1.7rem;
      margin: 0 0 6px;
      letter-spacing: -0.01em;
    }
    .subtitle { color: var(--muted); margin: 0; font-size: 0.95rem; }
    ul.downloads { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    li.item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow);
    }
    .icon {
      flex: 0 0 auto;
      width: 40px; height: 40px;
      display: grid; place-items: center;
      font-size: 1.4rem;
      border-radius: 10px;
      background: var(--tag-bg);
      user-select: none;
    }
    .meta { flex: 1 1 auto; min-width: 0; }
    .label { font-weight: 600; font-size: 1.02rem; }
    .sub {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 2px;
      word-break: break-word;
    }
    .tag {
      display: inline-block;
      background: var(--tag-bg);
      color: var(--tag-fg);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 1px 8px;
      border-radius: 999px;
      margin-left: 8px;
      vertical-align: middle;
    }
    a.btn {
      flex: 0 0 auto;
      background: var(--accent);
      color: var(--accent-fg);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 9px 16px;
      border-radius: 8px;
      white-space: nowrap;
      transition: filter 0.15s ease;
    }
    a.btn:hover { filter: brightness(1.08); }
    a.btn:active { filter: brightness(0.94); }
    .size { color: var(--muted); font-variant-numeric: tabular-nums; }
    .notice {
      background: var(--card-bg);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 32px 20px;
      text-align: center;
      color: var(--muted);
    }
    footer { margin-top: 40px; color: var(--muted); font-size: 0.8rem; text-align: center; }
    @media (max-width: 520px) {
      li.item { flex-wrap: wrap; }
      a.btn { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>BioBank Thick Client</h1>
      <p class="subtitle" id="subtitle">Download the desktop client for your platform.</p>
    </header>
    <ul class="downloads" id="list" hidden></ul>
    <div class="notice" id="notice">Loading available downloads&hellip;</div>
    <footer>Canadian BioSample Repository</footer>
  </div>

  <script>
    (function () {
      var LIST = document.getElementById('list');
      var NOTICE = document.getElementById('notice');
      var SUBTITLE = document.getElementById('subtitle');

      var OS = {
        linux:  { name: 'Linux',   icon: '🐧' }, // penguin
        macosx: { name: 'macOS',   icon: '🍎' }, // apple
        win32:  { name: 'Windows', icon: '🪟' }  // window
      };
      var ARCH = { x86_64: '64-bit', x86: '32-bit' };
      // Sort weighting so the list reads in a predictable order.
      var OS_ORDER = { linux: 0, win32: 1, macosx: 2 };
      var ARCH_ORDER = { x86_64: 0, x86: 1 };

      var RE = /^BioBank-(.+?)-(linux|macosx|win32)\.[^.]+\.(x86_64|x86)(_with_jre)?\.zip$/;

      function parse(name) {
        var m = RE.exec(name);
        if (!m) {
          return { label: name, sub: '', icon: '📦', matched: false };
        }
        var version = m[1];
        var os = OS[m[2]];
        var arch = ARCH[m[3]] || m[3];
        var withJre = !!m[4];
        return {
          label: os.name + ' ' + arch,
          version: version,
          withJre: withJre,
          icon: os.icon,
          sub: withJre ? 'Bundled Java runtime - nothing else to install.'
                       : 'Requires a Java runtime already installed.',
          matched: true,
          osOrder: OS_ORDER[m[2]],
          archOrder: ARCH_ORDER[m[3]],
          jreOrder: withJre ? 0 : 1
        };
      }

      function humanSize(bytes) {
        if (typeof bytes !== 'number' || bytes < 0) return '';
        var units = ['B', 'KB', 'MB', 'GB', 'TB'];
        var i = 0, n = bytes;
        while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
        return (i === 0 ? n : n.toFixed(n < 10 ? 1 : 0)) + ' ' + units[i];
      }

      function showNotice(html) {
        NOTICE.innerHTML = html;
        NOTICE.hidden = false;
        LIST.hidden = true;
      }

      function render(files) {
        // Attach parsed metadata and sort.
        var items = files.map(function (f) {
          var p = parse(f.name);
          p.name = f.name;
          p.size = f.size;
          return p;
        });
        items.sort(function (a, b) {
          if (a.matched !== b.matched) return a.matched ? -1 : 1;
          if (a.matched) {
            if (a.osOrder !== b.osOrder) return a.osOrder - b.osOrder;
            if (a.jreOrder !== b.jreOrder) return a.jreOrder - b.jreOrder;
            if (a.archOrder !== b.archOrder) return a.archOrder - b.archOrder;
          }
          return a.name.localeCompare(b.name);
        });

        // Show a shared version in the subtitle when every match agrees.
        var versions = {};
        items.forEach(function (it) { if (it.version) versions[it.version] = true; });
        var vlist = Object.keys(versions);
        if (vlist.length === 1) {
          SUBTITLE.textContent = 'Version ' + vlist[0] + ' - download the desktop client for your platform.';
        }

        LIST.innerHTML = '';
        items.forEach(function (it) {
          var li = document.createElement('li');
          li.className = 'item';

          var icon = document.createElement('div');
          icon.className = 'icon';
          icon.textContent = it.icon;

          var meta = document.createElement('div');
          meta.className = 'meta';
          var label = document.createElement('div');
          label.className = 'label';
          label.textContent = it.label;
          if (it.matched && it.withJre) {
            var tag = document.createElement('span');
            tag.className = 'tag';
            tag.textContent = 'with JRE';
            label.appendChild(tag);
          }
          var sub = document.createElement('div');
          sub.className = 'sub';
          var sizeText = humanSize(it.size);
          sub.innerHTML = '';
          if (it.sub) sub.appendChild(document.createTextNode(it.sub + ' '));
          if (sizeText) {
            var s = document.createElement('span');
            s.className = 'size';
            s.textContent = (it.sub ? '· ' : '') + sizeText;
            sub.appendChild(s);
          }
          meta.appendChild(label);
          meta.appendChild(sub);

          var btn = document.createElement('a');
          btn.className = 'btn';
          btn.href = 'files/' + encodeURIComponent(it.name);
          btn.setAttribute('download', '');
          btn.textContent = 'Download';

          li.appendChild(icon);
          li.appendChild(meta);
          li.appendChild(btn);
          LIST.appendChild(li);
        });

        NOTICE.hidden = true;
        LIST.hidden = false;
      }

      fetch('files.json', { cache: 'no-store' })
        .then(function (resp) {
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          return resp.json();
        })
        .then(function (entries) {
          var files = (entries || []).filter(function (e) {
            return e && e.type === 'file' && /\.zip$/i.test(e.name);
          });
          if (!files.length) {
            showNotice('No downloads are available right now.');
            return;
          }
          render(files);
        })
        .catch(function () {
          showNotice('Could not load the list of downloads. Please try again later.');
        });
    })();
  </script>
</body>
</html>
