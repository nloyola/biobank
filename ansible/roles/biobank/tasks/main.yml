---
# Every task here runs as the biobank operator (become_user set at the role
# level in site.yml). The operator role has already created /opt/biobank as the
# account's home, so the repo below is cloned into and owned by that account.
- name: Clone or update the biobank repository
  ansible.builtin.git:
    repo: "{{ biobank_repo_url }}"
    dest: "{{ biobank_repo_dest }}"
    version: "{{ biobank_repo_version }}"
    update: true
    # Discard stray edits to tracked build artifacts (e.g. messages.mo);
    # untracked files such as .env and logs/ are left untouched.
    force: true
    # The eclipse_ws/* submodules use dead git:// URLs (GitHub dropped the
    # unencrypted git protocol) and are client-side only - the server Docker
    # stack does not need them, so never recurse into submodules.
    recursive: false

- name: Render .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ biobank_repo_dest }}/.env"
    mode: "0600"

- name: Detect whether the database is already seeded
  ansible.builtin.stat:
    path: "{{ biobank_repo_dest }}/database/lib/ibdata1"
  register: biobank_db_seeded

# Only when a dump URL is configured. Sites that copy the dump in by hand leave
# biobank_db_dump_url empty and this is skipped; the seeded guard avoids
# clobbering a live database.
- name: Fetch the initial DB dump (only when a URL is set and not yet seeded)
  ansible.builtin.get_url:
    url: "{{ biobank_db_dump_url }}"
    dest: "{{ biobank_repo_dest }}/database/db_initial.sql.gz"
    mode: "0644"
  when:
    - biobank_db_dump_url | length > 0
    - not biobank_db_seeded.stat.exists

# Runs after the fetch so it reflects a just-fetched dump as well as one the
# operator copied in by hand. Gates whether the stack can be started below.
- name: Detect whether the initial DB dump is present
  ansible.builtin.stat:
    path: "{{ biobank_repo_dest }}/database/db_initial.sql.gz"
  register: biobank_db_dump

# The db service bind-mounts database/db_initial.sql.gz into the container. If
# that path exists but is NOT a regular file (typically an empty directory that
# Docker auto-created for the bind mount when the dump was missing at a previous
# start), the seed imports nothing and the app comes up against an empty DB.
# Fail loudly here rather than let that happen. Only relevant when a fresh seed
# would run (DB not yet seeded).
- name: Fail if the DB dump path exists but is not a regular file
  ansible.builtin.fail:
    msg: >-
      {{ biobank_repo_dest }}/database/db_initial.sql.gz exists but is not a
      regular file (likely a directory Docker created for the bind mount because
      the dump was missing at a previous start). Replace it with the real dump
      file before starting, or the database will seed empty.
  when:
    - not biobank_db_seeded.stat.exists
    - biobank_db_dump.stat.exists
    - not biobank_db_dump.stat.isreg

# Can start only with a database to serve: already seeded, or a real dump file
# present for the db container to import on first start.
- name: Determine whether the stack can be started
  ansible.builtin.set_fact:
    biobank_can_start: "{{ biobank_db_seeded.stat.exists or (biobank_db_dump.stat.exists and biobank_db_dump.stat.isreg) }}"

- name: Detect whether the TLS certificate exists
  ansible.builtin.stat:
    path: "{{ biobank_repo_dest }}/docker/nginx-selfsigned.crt"
  register: biobank_cert

- name: Generate a self-signed TLS certificate (non-interactive)
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -newkey rsa:4096 -sha256 -days 3650 -nodes
      -keyout docker/nginx-selfsigned.key
      -out docker/nginx-selfsigned.crt
      -subj "/CN={{ biobank_cert_cn }}"
      -addext "subjectAltName={{ biobank_cert_san }}"
    chdir: "{{ biobank_repo_dest }}"
  changed_when: true
  when: not biobank_cert.stat.exists

- name: Check whether the tomcat image is built
  ansible.builtin.command:
    cmd: docker image inspect nloyola/biobank:0.1
  register: biobank_image
  changed_when: false
  failed_when: false

- name: Build images (only when missing)
  ansible.builtin.command:
    cmd: ./bb-build.sh
    chdir: "{{ biobank_repo_dest }}"
  changed_when: true
  when: biobank_image.rc != 0

# On a fresh host where the operator will copy the dump in later, this is
# skipped (see the notice below).
- name: Start the stack
  ansible.builtin.command:
    cmd: ./bb-start.sh
    chdir: "{{ biobank_repo_dest }}"
  register: biobank_start
  changed_when: "'Started' in biobank_start.stderr or 'Created' in biobank_start.stderr"
  when: biobank_can_start

- name: Report that the stack was not started (no database yet)
  ansible.builtin.debug:
    msg: >-
      Stack provisioned but NOT started: the database is not seeded and no dump
      file is present. Copy the dump to
      {{ biobank_repo_dest }}/database/db_initial.sql.gz, then run ./bb-start.sh
      on the host (or re-run this playbook).
  when: not biobank_can_start
