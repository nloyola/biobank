---
# Repository to deploy
biobank_repo_url: "https://github.com/nloyola/biobank.git"
biobank_repo_version: "ltri-dev-docker"
# Cloned into the operator account's home (/opt/biobank) and owned by it.
biobank_repo_dest: "/opt/biobank/biobank-server"

# Operator account: a dedicated, unprivileged user that owns the repo and runs
# the stack. Decoupled from the Ansible connection user (ansible_user), which
# only needs sudo to provision. Created by the operator role.
biobank_operator_user: "biobank"
biobank_operator_home: "/opt/biobank"
biobank_operator_shell: "/usr/bin/zsh"

# Interactive shell tooling installed for the operators (not needed to run the
# stack; makes an operator's login nicer). zsh becomes each account's login
# shell, with fzf + zoxide wired into its .zshrc by the operator role.
biobank_shell_packages:
  - zsh
  - fzf
  - zoxide

# lazydocker (terminal UI for Docker), installed system-wide to /usr/local/bin
# for all users. Not packaged in apt, so the pinned release binary is fetched
# from GitHub. The tarball arch token differs from ansible_architecture for
# arm (aarch64 -> arm64); x86_64 matches directly.
lazydocker_version: "0.25.2"
lazydocker_tarball_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else ansible_architecture }}"
lazydocker_release_base: "https://github.com/jesseduffield/lazydocker/releases/download"

# Accounts that get zsh as their login shell and the managed .zshrc block.
biobank_zsh_accounts:
  - { name: "biobank", home: "/opt/biobank" }
  - { name: "bbadmin", home: "/home/bbadmin" }

# TLS certificate (per site). CN is the address the thick client connects to;
# SAN must include it too (Java 7 enforces subjectAltName).
biobank_cert_cn: "biobankarchive.lunenfeld.ca"
biobank_cert_san: "DNS:biobankarchive.lunenfeld.ca"

# Initial database dump URL. Leave empty to skip the automatic fetch (e.g. when
# the operator copies the dump in by hand); the fetch runs only when this is set
# and the DB is not yet seeded.
biobank_db_dump_url: ""

# Non-secret .env values
biobank_env_mode: "PRODUCTION"
biobank_compose_project_name: "bb"
# Aligned with the biobank operator account (uid/gid 1001) so container-written
# bind-mount files (DB data, logs) are owned by that account, not orphaned.
biobank_uid: 1001
biobank_gid: 1001
biobank_log_level: "INFO"
biobank_db_host: "localhost"
biobank_db_port: 3306
biobank_db_root_user: "root"
biobank_db_name: "biobank"
biobank_db_user: "biobank"
