---
- name: Provision the biobank server
  hosts: biobank
  gather_facts: true
  roles:
    # Install the Docker engine and create the docker group (as root).
    - role: docker
      become: true
    # Create the biobank operator account and the operators' shell environment
    # (as root).
    - role: operator
      become: true
    # Deploy and run the stack as the unprivileged biobank operator. A fresh
    # sudo-to-biobank picks up its docker group membership directly, so no
    # connection reset is needed.
    - role: biobank
      become: true
      become_user: "{{ biobank_operator_user }}"
